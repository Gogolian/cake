<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #f4b942;
      --user-bg: #1e2a3a;
      --assistant-bg: #1a1a1a;
      --tool-bg: #0f1f0f;
      --tool-border: #2a4a2a;
      --error: #c0392b;
      --radius: 8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0;
      overflow: hidden;
    }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 600; margin: 0; }
    #model-picker {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      max-width: 260px;
      outline: none;
    }
    #model-picker:focus { border-color: var(--accent); }
    #model-picker:disabled { opacity: .5; }
    #context { font-size: 12px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
    #status { font-size: 12px; color: var(--muted); }
    #status.ok  { color: #4caf50; }
    #status.err { color: var(--error); }
    #app {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    #sidebar {
      width: 220px;
      min-width: 160px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    #new-session-btn {
      margin: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
    }
    #new-session-btn:hover { background: var(--surface); color: var(--text); border-color: var(--accent); border-style: solid; }
    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .session-item {
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.1s;
      min-width: 0;
    }
    .session-item:hover { background: var(--surface); }
    .session-item.active { background: var(--surface); border-color: var(--border); }
    .session-item .sess-title {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .session-item .sess-date {
      font-size: 10px;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }
    .session-item.busy .sess-title::after { content: ' \231B'; font-size: 10px; }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    #messages-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .session-pane {
      display: none;
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 16px 20px;
      flex-direction: column;
      gap: 12px;
    }
    .session-pane.active { display: flex; }
    .msg {
      padding: 12px 16px;
      border-radius: var(--radius);
      max-width: 900px;
      width: 100%;
      align-self: flex-start;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user      { background: var(--user-bg); align-self: flex-end; }
    .msg.assistant { background: var(--assistant-bg); border: 1px solid var(--border); }
    .msg.tool      { background: var(--tool-bg); border: 1px solid var(--tool-border); font-family: var(--font-mono); font-size: 12px; }
    .msg .label    { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .msg .label .model { text-transform: none; letter-spacing: 0; color: var(--accent); font-family: var(--font-mono); }
    .msg.tool .label { color: #6dbf67; }
    .msg.user .label { color: #5b9bd5; }
    code, pre { font-family: var(--font-mono); }
    pre { background: #111; border: 1px solid var(--border); border-radius: 4px; padding: 10px; overflow-x: auto; margin: 8px 0; }
    code { background: #111; padding: 1px 4px; border-radius: 3px; }
    .thinking { color: var(--muted); font-style: italic; }
    footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    #controls { display: flex; gap: 8px; align-items: center; }
    #send-btn {
      width: 40px; height: 40px; padding: 0;
      border-radius: 9999px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; line-height: 1;
    }
    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      font-family: inherit;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    #clear-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    #login-btn { margin-left: 4px; padding: 6px 12px; font-size: 12px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<header>
  <span>&#x1F382;</span>
  <h1>cake</h1>
  <button id="login-btn" style="display:none">Sign in to GitHub Copilot</button>
  <div style="flex:1"></div>
  <select id="model-picker" title="Provider / model" disabled></select>
  <span id="context" title="Estimated context tokens used / model maximum"></span>
  <span id="status">connecting&#x2026;</span>
</header>

<div id="app">
  <div id="sidebar">
    <button id="new-session-btn">+ New session</button>
    <div id="session-list"></div>
  </div>
  <div id="main">
    <div id="messages-container"></div>
    <footer>
      <textarea id="input" placeholder="Ask anything&#x2026; (Shift+Enter for newline)" rows="1"></textarea>
      <div id="controls">
        <button id="clear-btn" title="Clear this session">&#x2715; Clear</button>
        <div style="flex:1"></div>
        <button id="send-btn" title="Send" aria-label="Send">&#x25BA;</button>
      </div>
    </footer>
  </div>
</div>

<script>
'use strict';

// ── per-session state ───────────────────────────────────────────────────────
// sessions: Map<id, { id, history, busy, pane, title }>
//   id      — timestamp string used as server session_start key
//   history — provider-neutral conversation array
//   busy    — true while LLM responding (does NOT block switching sessions)
//   pane    — the .session-pane DOM element for this session's messages
//   title   — first user message (up to 60 chars), or null
//
// Multiple sessions can be busy simultaneously. Each agentLoop writes only to
// its own session's history and pane. There is no shared mutable state between
// sessions, so N concurrent conversations cannot cross-contaminate.

const sessions = new Map();
let activeSessionId = null;
const MAX_STEPS = 20;

// ── DOM refs ───────────────────────────────────────────────────────────────
const $msgContainer = document.getElementById('messages-container');
const $sessionList  = document.getElementById('session-list');
const $input        = document.getElementById('input');
const $sendBtn      = document.getElementById('send-btn');
const $clearBtn     = document.getElementById('clear-btn');
const $status       = document.getElementById('status');
const $loginBtn     = document.getElementById('login-btn');
const $picker       = document.getElementById('model-picker');
const $context      = document.getElementById('context');

let modelMax = {};
let serverSessionList = [];

// ── utilities ──────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  // Strip tool-call IDs before rendering — name + input are sufficient for display
  const t = text.replace(/(\*\*\u2192 [^*\n]+\*\*) `[^\n`]+`/g, '$1');
  return escapeHtml(t)
    .replace(/```([\s\S]*?)```/g, (_,c) => '<pre><code>' + c.trim() + '</code></pre>')
    .replace(/`([^`]+)`/g, (_,c) => '<code>' + c + '</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function setStatus(msg, cls) {
  $status.textContent = msg;
  $status.className = cls || '';
}

// ── model picker + context meter ───────────────────────────────────────────
function selectedModel() {
  const val = $picker.value || '';
  const slash = val.indexOf('/');
  if (slash < 0) return null;
  return { provider: val.slice(0, slash), model: val.slice(slash + 1), max: modelMax[val] || 0 };
}

function buildPicker(list) {
  const prev = $picker.value;
  $picker.innerHTML = '';
  modelMax = {};
  let count = 0;
  for (const p of list) {
    if (!p.models || !p.models.length) continue;
    const group = document.createElement('optgroup');
    group.label = p.label || p.id;
    for (const m of p.models) {
      const val = p.id + '/' + m.id;
      modelMax[val] = m.maxContext || 0;
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = val;
      group.appendChild(opt); count++;
    }
    $picker.appendChild(group);
  }
  if (!count) {
    const opt = document.createElement('option');
    opt.value = ''; opt.textContent = 'no models available';
    $picker.appendChild(opt); $picker.disabled = true; return;
  }
  $picker.disabled = false;
  if (prev && Object.prototype.hasOwnProperty.call(modelMax, prev)) $picker.value = prev;
}

function fmtTokens(n) {
  n = Number(n) || 0;
  return n >= 1000 ? (Math.round(n / 100) / 10) + 'k' : String(n);
}

function estimateTokens(hist) {
  let chars = 0;
  for (const m of hist) {
    if (typeof m.content === 'string') chars += m.content.length;
    for (const tc of m.tool_calls || []) {
      chars += (tc.name || '').length + JSON.stringify(tc.input || {}).length;
    }
  }
  return Math.ceil(chars / 4);
}

function updateContext() {
  const sess = activeSessionId ? sessions.get(activeSessionId) : null;
  const hist = sess ? sess.history : [];
  const sel  = selectedModel();
  const used = estimateTokens(hist);
  if (sel && sel.max) $context.textContent = 'ctx \u2248 ' + fmtTokens(used) + ' / ' + fmtTokens(sel.max);
  else if (used)      $context.textContent = 'ctx \u2248 ' + fmtTokens(used);
  else                $context.textContent = '';
}

// ── session pane helpers ───────────────────────────────────────────────────
function createPane(id) {
  const pane = document.createElement('div');
  pane.className = 'session-pane';
  pane.dataset.sessionId = id;
  $msgContainer.appendChild(pane);
  return pane;
}

function addMsg(pane, role, content, extra) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const label = role === 'user' ? 'You' : role === 'tool' ? (extra || 'tool') : 'Assistant';
  el.innerHTML = '<div class="label">' + escapeHtml(label) + '</div>'
    + '<div class="body">' + renderMarkdown(content) + '</div>';
  pane.appendChild(el);
  if (pane.classList.contains('active')) el.scrollIntoView({ block: 'end' });
  return el;
}

function updateMsg(el, text) {
  el.querySelector('.body').innerHTML = renderMarkdown(text);
  const pane = el.closest('.session-pane');
  if (pane && pane.classList.contains('active')) el.scrollIntoView({ block: 'end' });
}

function setModelLabel(el, meta) {
  if (!meta || !meta.model) return;
  const label = el.querySelector('.label');
  if (!label) return;
  label.textContent = 'Assistant ';
  const tag = document.createElement('span');
  tag.className = 'model';
  tag.textContent = meta.provider ? meta.provider + '/' + meta.model : meta.model;
  label.appendChild(tag);
}

// ── session lifecycle ──────────────────────────────────────────────────────
function createLocalSession(id) {
  id = id || String(Date.now());
  const pane = createPane(id);
  sessions.set(id, { id, history: [], busy: false, pane, title: null });
  return id;
}

function switchSession(id) {
  if (activeSessionId) {
    const prev = sessions.get(activeSessionId);
    if (prev) prev.pane.classList.remove('active');
    const oldItem = $sessionList.querySelector('.session-item[data-id="' + activeSessionId + '"]');
    if (oldItem) oldItem.classList.remove('active');
  }

  activeSessionId = id;
  const sess = sessions.get(id);
  if (!sess) return;

  sess.pane.classList.add('active');
  sess.pane.scrollTop = sess.pane.scrollHeight;

  // Send button reflects THIS session's busy state only
  $sendBtn.disabled = sess.busy;

  $sessionList.querySelectorAll('.session-item.active').forEach(el => el.classList.remove('active'));
  const newItem = $sessionList.querySelector('.session-item[data-id="' + id + '"]');
  if (newItem) newItem.classList.add('active');

  updateContext();
}

function refreshSessionItem(id) {
  const item = $sessionList.querySelector('.session-item[data-id="' + id + '"]');
  if (!item) { renderSessionList(); return; }
  const sess = sessions.get(id);
  item.classList.toggle('active', id === activeSessionId);
  item.classList.toggle('busy', !!(sess && sess.busy));
  if (sess && sess.title) {
    const t = item.querySelector('.sess-title');
    if (t) t.textContent = sess.title;
  }
}

// ── sidebar ────────────────────────────────────────────────────────────────
function renderSessionList() {
  $sessionList.innerHTML = '';

  const serverIds = new Set(serverSessionList.map(s => s.id));
  const localOnly = [...sessions.values()]
    .filter(s => !serverIds.has(s.id))
    .sort((a, b) => Number(b.id) - Number(a.id));

  for (const s of localOnly) {
    appendSessionItem({ id: s.id, title: s.title || 'New conversation', date: null });
  }

  for (const s of serverSessionList) {
    const mem = sessions.get(s.id);
    appendSessionItem({
      id: s.id,
      title: (mem && mem.title) || s.title || ('Session ' + (s.date || s.id)),
      date: s.date,
    });
  }
}

function appendSessionItem({ id, title, date }) {
  const item = document.createElement('div');
  item.className = 'session-item';
  item.dataset.id = id;
  if (id === activeSessionId) item.classList.add('active');
  const sess = sessions.get(id);
  if (sess && sess.busy) item.classList.add('busy');

  const t = document.createElement('span');
  t.className = 'sess-title';
  t.textContent = title;
  item.appendChild(t);

  if (date) {
    const d = document.createElement('span');
    d.className = 'sess-date';
    d.textContent = date;
    item.appendChild(d);
  }

  item.addEventListener('click', () => loadSession(id));
  $sessionList.appendChild(item);
}

async function refreshSessionList() {
  try {
    const resp = await fetch('/api/sessions');
    if (resp.ok) serverSessionList = await resp.json();
  } catch (_) {}
  renderSessionList();
}

async function loadSession(id) {
  if (!sessions.has(id)) {
    const pane = createPane(id);
    sessions.set(id, { id, history: [], busy: false, pane, title: null });

    try {
      const resp = await fetch('/api/session?id=' + encodeURIComponent(id));
      if (resp.ok) {
        const data = await resp.json();
        const sess = sessions.get(id);
        if (sess && Array.isArray(data.history)) {
          sess.history = data.history;
          for (const msg of data.history) {
            if (msg.role === 'user') {
              addMsg(pane, 'user', msg.content || '');
              if (!sess.title && msg.content) sess.title = msg.content.slice(0, 60);
            } else if (msg.role === 'assistant') {
              addMsg(pane, 'assistant', msg.content || '(used tools)');
            } else if (msg.role === 'tool') {
              addMsg(pane, 'tool', msg.content || '', 'tool result');
            }
          }
        }
      }
    } catch (_) {}
  }

  switchSession(id);
  renderSessionList();
}

function newSession() {
  const id = createLocalSession();
  renderSessionList();
  switchSession(id);
  $input.focus();
  return id;
}

// ── streaming ──────────────────────────────────────────────────────────────
// Each call is fully independent: own fetch, own reader, own closure variables.
// Concurrent calls for different sessions do not share any state.
async function streamChat(messages, sessionId, onText, onMeta) {
  const sel = selectedModel();
  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages,
      provider:      sel ? sel.provider : undefined,
      model:         sel ? sel.model    : undefined,
      session_start: sessionId,
    }),
  });

  if (!resp.ok) throw new Error('HTTP ' + resp.status);

  const reader  = resp.body.getReader();
  const decoder = new TextDecoder();
  let   buf     = '';
  const result  = { text: '', tool_calls: [], meta: null };

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      const raw = line.slice(5).trim();
      if (!raw) continue;
      let ev;
      try { ev = JSON.parse(raw); } catch (_) { continue; }
      if      (ev.type === 'meta')  { result.meta = ev; if (onMeta) onMeta(ev); }
      else if (ev.type === 'text')  { result.text += ev.text; if (onText) onText(result.text); }
      else if (ev.type === 'tool')  result.tool_calls.push({ id: ev.id, name: ev.name, input: ev.input });
      else if (ev.type === 'error') throw new Error(ev.error);
    }
  }
  return result;
}

// ── tool execution ─────────────────────────────────────────────────────────
async function executeTool(name, input) {
  const resp = await fetch('/api/tool', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, input }),
  });
  return resp.json();
}

// ── per-session agentic loop ───────────────────────────────────────────────
// All reads/writes are scoped to sessId. Calling this for sessions A and B
// concurrently is safe: JS event loop multiplexes the awaits, each session
// uses its own history array and DOM pane. No cross-session state.
async function agentLoop(sessId, userText) {
  const sess = sessions.get(sessId);
  if (!sess) return;

  sess.history.push({ role: 'user', content: userText });
  addMsg(sess.pane, 'user', userText);

  for (let step = 0; step < MAX_STEPS; step++) {
    const el = addMsg(sess.pane, 'assistant', '\u2026');
    el.querySelector('.body').classList.add('thinking');

    let result;
    try {
      result = await streamChat(
        sess.history,
        sessId,
        (text) => updateMsg(el, text),
        (meta) => setModelLabel(el, meta),
      );
    } catch (err) {
      updateMsg(el, 'Error: ' + err.message);
      return;
    }

    const text      = result.text.trim();
    const toolCalls = result.tool_calls.filter(tc => tc && tc.name);

    if (text) updateMsg(el, text);
    else if (toolCalls.length) updateMsg(el, '(using tools\u2026)');
    else el.remove();

    if (text || toolCalls.length) {
      sess.history.push({ role: 'assistant', content: text, tool_calls: toolCalls });
    }

    if (!toolCalls.length) { updateContext(); break; }

    for (const tc of toolCalls) {
      const preview    = JSON.stringify(tc.input, null, 2);
      const toolEl     = addMsg(sess.pane, 'tool', preview, tc.name);
      const toolResult = await executeTool(tc.name, tc.input);
      const output     = JSON.stringify(toolResult, null, 2);
      updateMsg(toolEl, preview + '\n\n\u2192 ' + output);
      sess.history.push({ role: 'tool', tool_call_id: tc.id, content: output });
    }
    updateContext();
  }
}


// ── send ───────────────────────────────────────────────────────────────────
async function send() {
  const text = $input.value.trim();
  if (!text) return;

  if (!activeSessionId || !sessions.has(activeSessionId)) newSession();
  const sessId = activeSessionId;
  const sess   = sessions.get(sessId);
  if (!sess || sess.busy) return;

  if (!sess.title) {
    sess.title = text.slice(0, 60);
    refreshSessionItem(sessId);
  }

  $input.value = '';
  $input.style.height = 'auto';
  sess.busy = true;
  $sendBtn.disabled = true;
  setStatus('thinking\u2026');
  refreshSessionItem(sessId);

  try {
    await agentLoop(sessId, text);
    setStatus('ready', 'ok');
  } catch (e) {
    setStatus('error: ' + e.message, 'err');
  }

  sess.busy = false;
  refreshSessionItem(sessId);
  refreshSessionList();

  if (activeSessionId === sessId) {
    $sendBtn.disabled = false;
    $input.focus();
  }
  updateContext();
}

$sendBtn.addEventListener('click', send);
$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
});
$picker.addEventListener('change', updateContext);
document.getElementById('new-session-btn').addEventListener('click', newSession);

$clearBtn.addEventListener('click', () => {
  if (!activeSessionId) return;
  const sess = sessions.get(activeSessionId);
  if (!sess || sess.busy) return;
  sess.history = [];
  sess.title   = null;
  sess.pane.innerHTML = '';
  renderSessionList();
  updateContext();
  setStatus('ready', 'ok');
});

// ── copilot sign-in ────────────────────────────────────────────────────────
function showLoginPrompt(userCode, verificationUri) {
  const sess = activeSessionId ? sessions.get(activeSessionId) : null;
  const pane = (sess && sess.pane) || $msgContainer;
  const el   = document.createElement('div');
  el.className = 'msg assistant';
  el.innerHTML = '<div class="label">Assistant</div><div class="body"></div>';
  const body = el.querySelector('.body');
  body.append('Sign in to GitHub Copilot:', document.createElement('br'), document.createElement('br'), '1. Open ');
  if (/^https:\/\//.test(verificationUri)) {
    const a = document.createElement('a');
    a.href = verificationUri; a.textContent = verificationUri;
    a.target = '_blank'; a.rel = 'noopener';
    body.append(a);
  } else {
    body.append(String(verificationUri));
  }
  const code = document.createElement('strong');
  code.textContent = userCode;
  body.append(document.createElement('br'), '2. Enter the code: ', code,
    document.createElement('br'), document.createElement('br'),
    'A browser window should have opened automatically. Waiting for you to authorize\u2026');
  pane.appendChild(el);
  el.scrollIntoView({ block: 'end' });
  return el;
}

async function signInCopilot() {
  const sess = activeSessionId ? sessions.get(activeSessionId) : null;
  if (sess && sess.busy) return;
  $loginBtn.disabled = true;
  $sendBtn.disabled  = true;
  setStatus('starting GitHub sign-in\u2026');
  let promptEl = null;
  try {
    const resp = await fetch('/api/login', { method: 'POST' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const raw = line.slice(5).trim();
        if (!raw) continue;
        let ev;
        try { ev = JSON.parse(raw); } catch (_) { continue; }
        if (ev.type === 'prompt') {
          setStatus('waiting for GitHub authorization\u2026');
          promptEl = showLoginPrompt(ev.user_code, ev.verification_uri);
        } else if (ev.type === 'error') {
          throw new Error(ev.error);
        }
      }
    }
    if (promptEl) updateMsg(promptEl, 'Signed in to GitHub Copilot \u2713');
    await refreshConfig();
  } catch (e) {
    if (promptEl) updateMsg(promptEl, 'Sign-in failed: ' + e.message);
    setStatus('sign-in failed: ' + e.message, 'err');
  } finally {
    $loginBtn.disabled = false;
    const activeSess = activeSessionId ? sessions.get(activeSessionId) : null;
    $sendBtn.disabled = !!(activeSess && activeSess.busy);
  }
}

$loginBtn.addEventListener('click', signInCopilot);

// ── config + init ──────────────────────────────────────────────────────────
async function refreshConfig() {
  try {
    const cfg  = await fetch('/api/config').then(r => r.json());
    const list = cfg.providers || [];
    buildPicker(list);
    const copilot = list.find(p => p.id === 'copilot');
    $loginBtn.style.display = (copilot && (!copilot.models || !copilot.models.length)) ? '' : 'none';
    const total = list.reduce((n, p) => n + ((p.models && p.models.length) || 0), 0);
    if (total) setStatus('ready', 'ok');
    else       setStatus('no providers configured \u2014 set an API key, start Ollama, or sign in', 'err');
    updateContext();
  } catch (e) {
    setStatus('server error', 'err');
  }
}

async function init() {
  await refreshConfig();
  await refreshSessionList();
  newSession();
}

init();
</script>
