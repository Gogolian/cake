<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cake 🎂</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #f4b942;
      --user-bg: #1e2a3a;
      --assistant-bg: #1a1a1a;
      --tool-bg: #0f1f0f;
      --tool-border: #2a4a2a;
      --error: #c0392b;
      --radius: 8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    #status { font-size: 12px; color: var(--muted); margin-left: auto; }
    #status.ok   { color: #4caf50; }
    #status.err  { color: var(--error); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: var(--radius);
      max-width: 900px;
      width: 100%;
      align-self: flex-start;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user      { background: var(--user-bg); align-self: flex-end; }
    .msg.assistant { background: var(--assistant-bg); border: 1px solid var(--border); }
    .msg.tool      { background: var(--tool-bg); border: 1px solid var(--tool-border); font-family: var(--font-mono); font-size: 12px; }
    .msg .label    { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .msg.tool .label { color: #6dbf67; }
    .msg.user .label { color: #5b9bd5; }
    code, pre { font-family: var(--font-mono); }
    pre { background: #111; border: 1px solid var(--border); border-radius: 4px; padding: 10px; overflow-x: auto; margin: 8px 0; }
    code { background: #111; padding: 1px 4px; border-radius: 3px; }
    footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      font-family: inherit;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    #clear-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .thinking { color: var(--muted); font-style: italic; }
    .tool-name { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
<header>
  <span>🎂</span>
  <h1>cake</h1>
  <span id="status">connecting…</span>
</header>
<div id="messages"></div>
<footer>
  <textarea id="input" placeholder="Ask anything… (Shift+Enter for newline)" rows="1"></textarea>
  <button id="clear-btn" title="Clear conversation">✕</button>
  <button id="send-btn">Send</button>
</footer>

<script>
'use strict';

// ── state ──────────────────────────────────────────────────────────────────
// history holds a provider-neutral conversation. The server translates it
// for whatever provider is configured, so this UI never deals with API shapes.
//   { role: 'user',      content: string }
//   { role: 'assistant', content: string, tool_calls: [{ id, name, input }] }
//   { role: 'tool',      tool_call_id: string, content: string }

let history = [];
let busy    = false;
const MAX_STEPS = 20;

// ── DOM refs ───────────────────────────────────────────────────────────────

const $messages = document.getElementById('messages');
const $input    = document.getElementById('input');
const $sendBtn  = document.getElementById('send-btn');
const $clearBtn = document.getElementById('clear-btn');
const $status   = document.getElementById('status');

// ── utilities ──────────────────────────────────────────────────────────────

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  // Very minimal markdown: code blocks, inline code, bold, italic
  return escapeHtml(text)
    .replace(/```([\s\S]*?)```/g, (_,c) => '<pre><code>' + c.trim() + '</code></pre>')
    .replace(/`([^`]+)`/g, (_,c) => '<code>' + c + '</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function addMessage(role, content, extra) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const label = role === 'user' ? 'You' : role === 'tool' ? (extra || 'tool') : 'Assistant';
  el.innerHTML = '<div class="label">' + escapeHtml(label) + '</div>'
    + '<div class="body">' + renderMarkdown(content) + '</div>';
  $messages.appendChild(el);
  el.scrollIntoView({ block: 'end' });
  return el;
}

function updateMessage(el, text) {
  el.querySelector('.body').innerHTML = renderMarkdown(text);
  el.scrollIntoView({ block: 'end' });
}

function setStatus(msg, cls) {
  $status.textContent = msg;
  $status.className = cls || '';
}

// ── streaming (unified events from server) ─────────────────────────────────
// The server emits a single event shape regardless of provider:
//   { type: 'text',  text }         – streamed assistant text
//   { type: 'tool',  id, name, input } – a complete tool call
//   { type: 'error', error }
//   { type: 'done' }

async function streamChat(messages, onText) {
  const resp = await fetch('/api/chat', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ messages }),
  });

  if (!resp.ok) throw new Error('HTTP ' + resp.status);

  const reader  = resp.body.getReader();
  const decoder = new TextDecoder();
  let   buffer  = '';
  const result  = { text: '', tool_calls: [] };

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      const raw = line.slice(5).trim();
      if (!raw) continue;
      let ev;
      try { ev = JSON.parse(raw); } catch (_) { continue; }
      if (ev.type === 'text') { result.text += ev.text; if (onText) onText(result.text); }
      else if (ev.type === 'tool')  result.tool_calls.push({ id: ev.id, name: ev.name, input: ev.input });
      else if (ev.type === 'error') throw new Error(ev.error);
    }
  }
  return result;
}

// ── tool execution ─────────────────────────────────────────────────────────

async function executeTool(name, input) {
  const resp = await fetch('/api/tool', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ name, input }),
  });
  return resp.json();
}

// ── agentic loop ───────────────────────────────────────────────────────────

async function agentLoop(userText) {
  history.push({ role: 'user', content: userText });

  for (let i = 0; i < MAX_STEPS; i++) {
    // Show "thinking" placeholder, streamed into as text arrives.
    const el = addMessage('assistant', '…');
    el.querySelector('.body').classList.add('thinking');

    let result;
    try {
      result = await streamChat(history, (text) => updateMessage(el, text));
    } catch (err) {
      updateMessage(el, 'Error: ' + err.message);
      return;
    }

    const text      = result.text.trim();
    const toolCalls = result.tool_calls.filter(tc => tc && tc.name);

    if (text) updateMessage(el, text);
    else      el.remove();

    // Record the assistant turn in the unified format.
    if (text || toolCalls.length) {
      history.push({ role: 'assistant', content: text, tool_calls: toolCalls });
    }

    if (!toolCalls.length) break;

    // Execute each tool and append its result.
    for (const tc of toolCalls) {
      const preview = JSON.stringify(tc.input, null, 2);
      const toolEl  = addMessage('tool', preview, tc.name);

      const toolResult = await executeTool(tc.name, tc.input);
      const output     = JSON.stringify(toolResult, null, 2);
      updateMessage(toolEl, preview + '\n\n→ ' + output);

      history.push({ role: 'tool', tool_call_id: tc.id, content: output });
    }
  }
}

// ── UI events ──────────────────────────────────────────────────────────────

async function send() {
  const text = $input.value.trim();
  if (!text || busy) return;
  busy = true;
  $sendBtn.disabled = true;
  $input.value = '';
  $input.style.height = 'auto';
  addMessage('user', text);
  setStatus('thinking…');
  try {
    await agentLoop(text);
    setStatus('ready', 'ok');
  } catch (e) {
    setStatus('error: ' + e.message, 'err');
  }
  busy = false;
  $sendBtn.disabled = false;
  $input.focus();
}

$sendBtn.addEventListener('click', send);

$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
});

$clearBtn.addEventListener('click', () => {
  history = [];
  $messages.innerHTML = '';
  setStatus('ready', 'ok');
});

// ── init ───────────────────────────────────────────────────────────────────

(async () => {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    const name = cfg.label || cfg.provider || 'unknown';
    if (cfg.configured) setStatus('ready — ' + name + ' · ' + cfg.model, 'ok');
    else                setStatus(name + ' not configured — set an API key', 'err');
  } catch (e) {
    setStatus('server error', 'err');
  }
})();
</script>
</body>
</html>
