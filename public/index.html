<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cake 🎂</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #f4b942;
      --user-bg: #1e2a3a;
      --assistant-bg: #1a1a1a;
      --tool-bg: #0f1f0f;
      --tool-border: #2a4a2a;
      --error: #c0392b;
      --radius: 8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    #model-picker {
      margin-left: auto;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      max-width: 260px;
      outline: none;
    }
    #model-picker:focus { border-color: var(--accent); }
    #model-picker:disabled { opacity: .5; }
    #context {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    #status { font-size: 12px; color: var(--muted); }
    #status.ok   { color: #4caf50; }
    #status.err  { color: var(--error); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: var(--radius);
      max-width: 900px;
      width: 100%;
      align-self: flex-start;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user      { background: var(--user-bg); align-self: flex-end; }
    .msg.assistant { background: var(--assistant-bg); border: 1px solid var(--border); }
    .msg.tool      { background: var(--tool-bg); border: 1px solid var(--tool-border); font-family: var(--font-mono); font-size: 12px; }
    .msg .label    { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .msg .label .model { text-transform: none; letter-spacing: 0; color: var(--accent); font-family: var(--font-mono); }
    .msg.tool .label { color: #6dbf67; }
    .msg.user .label { color: #5b9bd5; }
    code, pre { font-family: var(--font-mono); }
    pre { background: #111; border: 1px solid var(--border); border-radius: 4px; padding: 10px; overflow-x: auto; margin: 8px 0; }
    code { background: #111; padding: 1px 4px; border-radius: 3px; }
    footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      font-family: inherit;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    #clear-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .thinking { color: var(--muted); font-style: italic; }
    .tool-name { color: var(--accent); font-weight: 700; }
    #login-btn { margin-left: 12px; padding: 6px 12px; font-size: 12px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<header>
  <span>🎂</span>
  <h1>cake</h1>
  <select id="model-picker" title="Provider / model" disabled></select>
  <span id="context" title="Estimated context tokens used / model maximum"></span>
  <span id="status">connecting…</span>
  <button id="login-btn" style="display:none">Sign in to GitHub Copilot</button>
</header>
<div id="messages"></div>
<footer>
  <textarea id="input" placeholder="Ask anything… (Shift+Enter for newline)" rows="1"></textarea>
  <button id="clear-btn" title="Clear conversation">✕</button>
  <button id="send-btn">Send</button>
</footer>

<script>
'use strict';

// ── state ──────────────────────────────────────────────────────────────────
// history holds a provider-neutral conversation. The server translates it
// for whatever provider is configured, so this UI never deals with API shapes.
//   { role: 'user',      content: string }
//   { role: 'assistant', content: string, tool_calls: [{ id, name, input }] }
//   { role: 'tool',      tool_call_id: string, content: string }

let history = [];
let busy    = false;
const MAX_STEPS = 20;

// ── DOM refs ───────────────────────────────────────────────────────────────

const $messages = document.getElementById('messages');
const $input    = document.getElementById('input');
const $sendBtn  = document.getElementById('send-btn');
const $clearBtn = document.getElementById('clear-btn');
const $status   = document.getElementById('status');
const $loginBtn = document.getElementById('login-btn');
const $picker   = document.getElementById('model-picker');
const $context  = document.getElementById('context');

// provider/model → max context tokens, filled in from /api/config.
let modelMax = {};

// ── utilities ──────────────────────────────────────────────────────────────

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  // Very minimal markdown: code blocks, inline code, bold, italic
  return escapeHtml(text)
    .replace(/```([\s\S]*?)```/g, (_,c) => '<pre><code>' + c.trim() + '</code></pre>')
    .replace(/`([^`]+)`/g, (_,c) => '<code>' + c + '</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function addMessage(role, content, extra) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const label = role === 'user' ? 'You' : role === 'tool' ? (extra || 'tool') : 'Assistant';
  el.innerHTML = '<div class="label">' + escapeHtml(label) + '</div>'
    + '<div class="body">' + renderMarkdown(content) + '</div>';
  $messages.appendChild(el);
  el.scrollIntoView({ block: 'end' });
  return el;
}

function updateMessage(el, text) {
  el.querySelector('.body').innerHTML = renderMarkdown(text);
  el.scrollIntoView({ block: 'end' });
}

// Annotate an assistant message with the provider/model that produced it.
function setModelLabel(el, meta) {
  if (!meta || !meta.model) return;
  const label = el.querySelector('.label');
  if (!label) return;
  label.textContent = 'Assistant ';
  const tag = document.createElement('span');
  tag.className = 'model';
  tag.textContent = meta.provider ? meta.provider + '/' + meta.model : meta.model;
  label.appendChild(tag);
}

function setStatus(msg, cls) {
  $status.textContent = msg;
  $status.className = cls || '';
}

// ── model picker + context meter ────────────────────────────────────────────

// Currently selected picker entry, split into provider + model + max context.
function selectedModel() {
  const val = $picker.value || '';
  const slash = val.indexOf('/');
  if (slash < 0) return null;
  return { provider: val.slice(0, slash), model: val.slice(slash + 1), max: modelMax[val] || 0 };
}

// Populate the picker from /api/config, grouping models by provider and using
// `provider/model` as both the value and the visible label. A previously chosen
// entry is preserved across refreshes when it still exists.
function buildPicker(list) {
  const prev = $picker.value;
  $picker.innerHTML = '';
  modelMax = {};
  let count = 0;
  for (const p of list) {
    if (!p.models || !p.models.length) continue;
    const group = document.createElement('optgroup');
    group.label = p.label || p.id;
    for (const m of p.models) {
      const val = p.id + '/' + m.id;
      modelMax[val] = m.maxContext || 0;
      const opt = document.createElement('option');
      opt.value = val;
      opt.textContent = val;
      group.appendChild(opt);
      count++;
    }
    $picker.appendChild(group);
  }
  if (!count) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = 'no models available';
    $picker.appendChild(opt);
    $picker.disabled = true;
    return;
  }
  $picker.disabled = false;
  if (prev && Object.prototype.hasOwnProperty.call(modelMax, prev)) $picker.value = prev;
}

// Compact token count, e.g. 128000 → "128k", 1234 → "1.2k".
function fmtTokens(n) {
  n = Number(n) || 0;
  return n >= 1000 ? (Math.round(n / 100) / 10) + 'k' : String(n);
}

// Rough token estimate for the provider-neutral history (~4 chars/token). Exact
// counts need a per-provider tokenizer; this is a dependency-free approximation.
function estimateTokens(hist) {
  let chars = 0;
  for (const m of hist) {
    if (typeof m.content === 'string') chars += m.content.length;
    for (const tc of m.tool_calls || []) {
      chars += (tc.name || '').length + JSON.stringify(tc.input || {}).length;
    }
  }
  return Math.ceil(chars / 4);
}

// Refresh the "≈ used / max" context indicator for the current selection.
function updateContext() {
  const sel = selectedModel();
  const used = estimateTokens(history);
  if (sel && sel.max) $context.textContent = 'ctx ≈ ' + fmtTokens(used) + ' / ' + fmtTokens(sel.max);
  else if (used)      $context.textContent = 'ctx ≈ ' + fmtTokens(used);
  else                $context.textContent = '';
}

// ── streaming (unified events from server) ─────────────────────────────────
// The server emits a single event shape regardless of provider:
//   { type: 'meta',  provider, model }  – which model is answering
//   { type: 'text',  text }         – streamed assistant text
//   { type: 'tool',  id, name, input } – a complete tool call
//   { type: 'error', error }
//   { type: 'done' }

async function streamChat(messages, onText, onMeta) {
  const sel = selectedModel();
  const resp = await fetch('/api/chat', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({
      messages,
      provider: sel ? sel.provider : undefined,
      model:    sel ? sel.model : undefined,
    }),
  });

  if (!resp.ok) throw new Error('HTTP ' + resp.status);

  const reader  = resp.body.getReader();
  const decoder = new TextDecoder();
  let   buffer  = '';
  const result  = { text: '', tool_calls: [], meta: null };

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      const raw = line.slice(5).trim();
      if (!raw) continue;
      let ev;
      try { ev = JSON.parse(raw); } catch (_) { continue; }
      if (ev.type === 'meta') { result.meta = ev; if (onMeta) onMeta(ev); }
      else if (ev.type === 'text') { result.text += ev.text; if (onText) onText(result.text); }
      else if (ev.type === 'tool')  result.tool_calls.push({ id: ev.id, name: ev.name, input: ev.input });
      else if (ev.type === 'error') throw new Error(ev.error);
    }
  }
  return result;
}

// ── tool execution ─────────────────────────────────────────────────────────

async function executeTool(name, input) {
  const resp = await fetch('/api/tool', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ name, input }),
  });
  return resp.json();
}

// ── agentic loop ───────────────────────────────────────────────────────────

async function agentLoop(userText) {
  history.push({ role: 'user', content: userText });

  for (let i = 0; i < MAX_STEPS; i++) {
    // Show "thinking" placeholder, streamed into as text arrives.
    const el = addMessage('assistant', '…');
    el.querySelector('.body').classList.add('thinking');

    let result;
    try {
      result = await streamChat(
        history,
        (text) => updateMessage(el, text),
        (meta) => setModelLabel(el, meta),
      );
    } catch (err) {
      updateMessage(el, 'Error: ' + err.message);
      return;
    }

    const text      = result.text.trim();
    const toolCalls = result.tool_calls.filter(tc => tc && tc.name);

    if (text) updateMessage(el, text);
    else if (result.meta) updateMessage(el, '(no text — used tools)');
    else      el.remove();

    // Record the assistant turn in the unified format.
    if (text || toolCalls.length) {
      history.push({ role: 'assistant', content: text, tool_calls: toolCalls });
    }

    if (!toolCalls.length) { updateContext(); break; }

    // Execute each tool and append its result.
    for (const tc of toolCalls) {
      const preview = JSON.stringify(tc.input, null, 2);
      const toolEl  = addMessage('tool', preview, tc.name);

      const toolResult = await executeTool(tc.name, tc.input);
      const output     = JSON.stringify(toolResult, null, 2);
      updateMessage(toolEl, preview + '\n\n→ ' + output);

      history.push({ role: 'tool', tool_call_id: tc.id, content: output });
    }
    updateContext();
  }
}

// ── UI events ──────────────────────────────────────────────────────────────

async function send() {
  const text = $input.value.trim();
  if (!text || busy) return;
  busy = true;
  $sendBtn.disabled = true;
  $input.value = '';
  $input.style.height = 'auto';
  addMessage('user', text);
  setStatus('thinking…');
  try {
    await agentLoop(text);
    setStatus('ready', 'ok');
  } catch (e) {
    setStatus('error: ' + e.message, 'err');
  }
  busy = false;
  $sendBtn.disabled = false;
  $input.focus();
}

$sendBtn.addEventListener('click', send);

$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
});

$picker.addEventListener('change', updateContext);

$clearBtn.addEventListener('click', () => {
  history = [];
  $messages.innerHTML = '';
  setStatus('ready', 'ok');
  updateContext();
});

// ── copilot sign-in (GitHub device flow, streamed over SSE) ─────────────────

// Load the provider/model list and (re)build the picker. Every configured or
// reachable provider contributes its models; the rest simply don't appear, so
// the app works with whatever is available. Copilot shows a sign-in button
// until it has models.
async function refreshConfig() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    const list = cfg.providers || [];
    buildPicker(list);
    const copilot = list.find(p => p.id === 'copilot');
    $loginBtn.style.display = (copilot && (!copilot.models || !copilot.models.length)) ? '' : 'none';
    const total = list.reduce((n, p) => n + ((p.models && p.models.length) || 0), 0);
    if (total) setStatus('ready', 'ok');
    else       setStatus('no providers configured — set an API key, start Ollama, or sign in', 'err');
    updateContext();
  } catch (e) {
    setStatus('server error', 'err');
  }
}

// Build the "enter this code" prompt with a real, clickable link (no innerHTML
// from server data, so the user_code / URL can't inject markup).
function showLoginPrompt(userCode, verificationUri) {
  const el = addMessage('assistant', '');
  const body = el.querySelector('.body');
  body.textContent = '';
  body.append('Sign in to GitHub Copilot:', document.createElement('br'), document.createElement('br'), '1. Open ');
  if (/^https:\/\//.test(verificationUri)) {
    const a = document.createElement('a');
    a.href = verificationUri; a.textContent = verificationUri;
    a.target = '_blank'; a.rel = 'noopener';
    body.append(a);
  } else {
    body.append(String(verificationUri));
  }
  const code = document.createElement('strong');
  code.textContent = userCode;
  body.append(
    document.createElement('br'),
    '2. Enter the code: ', code,
    document.createElement('br'), document.createElement('br'),
    'A browser window should have opened automatically. Waiting for you to authorize…',
  );
  el.scrollIntoView({ block: 'end' });
  return el;
}

async function signInCopilot() {
  if (busy) return;
  busy = true;
  $loginBtn.disabled = true;
  $sendBtn.disabled = true;
  setStatus('starting GitHub sign-in…');
  let promptEl = null;
  try {
    const resp = await fetch('/api/login', { method: 'POST' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let   buffer  = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const raw = line.slice(5).trim();
        if (!raw) continue;
        let ev;
        try { ev = JSON.parse(raw); } catch (_) { continue; }
        if (ev.type === 'prompt') {
          setStatus('waiting for GitHub authorization…');
          promptEl = showLoginPrompt(ev.user_code, ev.verification_uri);
        } else if (ev.type === 'error') {
          throw new Error(ev.error);
        }
      }
    }
    if (promptEl) updateMessage(promptEl, 'Signed in to GitHub Copilot ✓');
    await refreshConfig();
  } catch (e) {
    if (promptEl) updateMessage(promptEl, 'Sign-in failed: ' + e.message);
    setStatus('sign-in failed: ' + e.message, 'err');
  } finally {
    busy = false;
    $loginBtn.disabled = false;
    $sendBtn.disabled = false;
  }
}

$loginBtn.addEventListener('click', signInCopilot);

// ── init ───────────────────────────────────────────────────────────────────

refreshConfig();
</script>
</body>
</html>
