<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span>&#x1F382;</span>
  <h1>cake</h1>
  <button id="login-btn" style="display:none">Sign in to GitHub Copilot</button>
</header>

<div id="app">
  <div id="sidebar">
    <button id="new-session-btn">+ New session</button>
    <div id="session-list"></div>
  </div>
  <div id="main">
    <div id="messages-container"></div>
    <footer>
      <textarea id="input" placeholder="Ask anything&#x2026; (Shift+Enter for newline)" rows="1"></textarea>
      <div id="controls">
        <select id="model-picker" title="Provider / model" disabled></select>
        <select id="reasoning-picker" title="Reasoning effort">
          <option value="">off</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
        <span id="context" title="Estimated context tokens used / model maximum"></span>
        <span id="status">connecting&#x2026;</span>
        <div style="flex:1"></div>
        <button id="send-btn" title="Send" aria-label="Send">&#x25BA;</button>
      </div>
    </footer>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
