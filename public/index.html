<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cake 🎂</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --muted: #888;
      --accent: #f4b942;
      --user-bg: #1e2a3a;
      --assistant-bg: #1a1a1a;
      --tool-bg: #0f1f0f;
      --tool-border: #2a4a2a;
      --error: #c0392b;
      --radius: 8px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    #status { font-size: 12px; color: var(--muted); margin-left: auto; }
    #status.ok   { color: #4caf50; }
    #status.err  { color: var(--error); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: var(--radius);
      max-width: 900px;
      width: 100%;
      align-self: flex-start;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user      { background: var(--user-bg); align-self: flex-end; }
    .msg.assistant { background: var(--assistant-bg); border: 1px solid var(--border); }
    .msg.tool      { background: var(--tool-bg); border: 1px solid var(--tool-border); font-family: var(--font-mono); font-size: 12px; }
    .msg .label    { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .msg.tool .label { color: #6dbf67; }
    .msg.user .label { color: #5b9bd5; }
    code, pre { font-family: var(--font-mono); }
    pre { background: #111; border: 1px solid var(--border); border-radius: 4px; padding: 10px; overflow-x: auto; margin: 8px 0; }
    code { background: #111; padding: 1px 4px; border-radius: 3px; }
    footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      font-family: inherit;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    #clear-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .thinking { color: var(--muted); font-style: italic; }
    .tool-name { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
<header>
  <span>🎂</span>
  <h1>cake</h1>
  <span id="status">connecting…</span>
</header>
<div id="messages"></div>
<footer>
  <textarea id="input" placeholder="Ask anything… (Shift+Enter for newline)" rows="1"></textarea>
  <button id="clear-btn" title="Clear conversation">✕</button>
  <button id="send-btn">Send</button>
</footer>

<script>
'use strict';

// ── state ──────────────────────────────────────────────────────────────────

let history    = [];  // [{role,content}]
let provider   = 'openai';
let busy       = false;

// ── DOM refs ───────────────────────────────────────────────────────────────

const $messages = document.getElementById('messages');
const $input    = document.getElementById('input');
const $sendBtn  = document.getElementById('send-btn');
const $clearBtn = document.getElementById('clear-btn');
const $status   = document.getElementById('status');

// ── utilities ──────────────────────────────────────────────────────────────

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  // Very minimal markdown: code blocks, inline code, bold, italic
  return escapeHtml(text)
    .replace(/```([\s\S]*?)```/g, (_,c) => '<pre><code>' + c.trim() + '</code></pre>')
    .replace(/`([^`]+)`/g, (_,c) => '<code>' + c + '</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function addMessage(role, content, extra) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const label = role === 'user' ? 'You' : role === 'tool' ? (extra || 'tool') : 'Assistant';
  el.innerHTML = '<div class="label">' + escapeHtml(label) + '</div>'
    + '<div class="body">' + renderMarkdown(content) + '</div>';
  $messages.appendChild(el);
  el.scrollIntoView({ block: 'end' });
  return el;
}

function updateMessage(el, text) {
  el.querySelector('.body').innerHTML = renderMarkdown(text);
  el.scrollIntoView({ block: 'end' });
}

function setStatus(msg, cls) {
  $status.textContent = msg;
  $status.className = cls || '';
}

// ── tool definitions (sent to LLM) ────────────────────────────────────────

const TOOLS_ANTHROPIC = [
  {
    name: 'bash',
    description: 'Run a shell command and return stdout/stderr.',
    input_schema: {
      type: 'object',
      properties: { command: { type: 'string', description: 'The bash command to run.' } },
      required: ['command'],
    },
  },
  {
    name: 'read_file',
    description: 'Read a file from the filesystem.',
    input_schema: {
      type: 'object',
      properties: { path: { type: 'string', description: 'Absolute or relative path to the file.' } },
      required: ['path'],
    },
  },
  {
    name: 'write_file',
    description: 'Write content to a file.',
    input_schema: {
      type: 'object',
      properties: {
        path:    { type: 'string', description: 'Path to write to.' },
        content: { type: 'string', description: 'Content to write.' },
      },
      required: ['path', 'content'],
    },
  },
  {
    name: 'list_dir',
    description: 'List directory contents.',
    input_schema: {
      type: 'object',
      properties: { path: { type: 'string', description: 'Directory path.' } },
      required: ['path'],
    },
  },
];

const TOOLS_OPENAI = TOOLS_ANTHROPIC.map(t => ({
  type: 'function',
  function: {
    name:        t.name,
    description: t.description,
    parameters:  t.input_schema,
  },
}));

// ── SSE / streaming helpers ────────────────────────────────────────────────

async function streamChat(messages) {
  const body = { messages };
  if (provider === 'anthropic') body.tools = TOOLS_ANTHROPIC;
  else                          body.tools = TOOLS_OPENAI;

  const resp = await fetch('/api/chat', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(body),
  });

  if (!resp.ok) throw new Error('HTTP ' + resp.status);

  const reader  = resp.body.getReader();
  const decoder = new TextDecoder();
  let   buffer  = '';
  const result  = { text: '', tool_calls: [] };

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      const raw = line.slice(5).trim();
      if (!raw || raw === '[DONE]') continue;
      try {
        const ev = JSON.parse(raw);
        if (provider === 'anthropic') parseAnthropicEvent(ev, result);
        else                          parseOpenAIEvent(ev, result);
      } catch (_) {}
    }
  }
  return result;
}

function parseAnthropicEvent(ev, result) {
  if (ev.type === 'content_block_delta') {
    if (ev.delta.type === 'text_delta')        result.text += ev.delta.text;
    if (ev.delta.type === 'input_json_delta') {
      const tc = result.tool_calls;
      if (!tc[ev.index]) tc[ev.index] = { name: '', input_json: '' };
      tc[ev.index].input_json += ev.delta.partial_json;
    }
  }
  if (ev.type === 'content_block_start' && ev.content_block.type === 'tool_use') {
    result.tool_calls[ev.index] = { name: ev.content_block.name, input_json: '' };
  }
}

function parseOpenAIEvent(ev, result) {
  const delta = ev.choices?.[0]?.delta;
  if (!delta) return;
  if (delta.content)     result.text += delta.content;
  if (delta.tool_calls) {
    for (const tc of delta.tool_calls) {
      if (!result.tool_calls[tc.index]) result.tool_calls[tc.index] = { name: '', input_json: '' };
      if (tc.function?.name)      result.tool_calls[tc.index].name       += tc.function.name;
      if (tc.function?.arguments) result.tool_calls[tc.index].input_json += tc.function.arguments;
    }
  }
}

// ── tool execution ─────────────────────────────────────────────────────────

async function executeTool(name, input) {
  const resp = await fetch('/api/tool', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ name, input }),
  });
  return resp.json();
}

// ── agentic loop ───────────────────────────────────────────────────────────

async function agentLoop(userText) {
  history.push({ role: 'user', content: userText });

  for (let i = 0; i < 20; i++) {
    // Show "thinking" placeholder
    const el = addMessage('assistant', '…');
    el.querySelector('.body').classList.add('thinking');

    let result;
    try {
      result = await streamChat(history);
    } catch (err) {
      updateMessage(el, 'Error: ' + err.message);
      return;
    }

    const text      = result.text.trim();
    const toolCalls = result.tool_calls.filter(tc => tc && tc.name);

    if (text) updateMessage(el, text);
    else      el.remove();

    // Push assistant turn
    if (provider === 'anthropic') {
      const content = [];
      if (text) content.push({ type: 'text', text });
      for (const tc of toolCalls) {
        let inp = {};
        try { inp = JSON.parse(tc.input_json); } catch (_) {}
        content.push({ type: 'tool_use', id: 'tool_' + Date.now() + '_' + Math.random().toString(36).slice(2), name: tc.name, input: inp });
      }
      if (content.length) history.push({ role: 'assistant', content });
    } else {
      if (text || toolCalls.length) {
        const msg = { role: 'assistant', content: text || null };
        if (toolCalls.length) {
          msg.tool_calls = toolCalls.map((tc, idx) => ({
            id: 'call_' + idx + '_' + Date.now(),
            type: 'function',
            function: { name: tc.name, arguments: tc.input_json },
          }));
        }
        history.push(msg);
      }
    }

    if (!toolCalls.length) break;

    // Execute each tool
    for (const tc of toolCalls) {
      let inp = {};
      try { inp = JSON.parse(tc.input_json); } catch (_) {}

      const preview = JSON.stringify(inp, null, 2);
      const toolEl  = addMessage('tool', preview, tc.name);

      const toolResult = await executeTool(tc.name, inp);
      const output     = JSON.stringify(toolResult, null, 2);
      updateMessage(toolEl, preview + '\n\n→ ' + output);

      // Add tool result to history
      if (provider === 'anthropic') {
        const assistantContent = history[history.length - 1].content;
        const useBlock = assistantContent.find(b => b.type === 'tool_use' && b.name === tc.name);
        const toolId = useBlock ? useBlock.id : 'tool_' + Date.now();
        history.push({ role: 'user', content: [{ type: 'tool_result', tool_use_id: toolId, content: output }] });
      } else {
        const lastMsg = history[history.length - 1];
        const callId  = lastMsg.tool_calls?.find(c => c.function.name === tc.name)?.id || 'call_0';
        history.push({ role: 'tool', tool_call_id: callId, content: output });
      }
    }
  }
}

// ── UI events ──────────────────────────────────────────────────────────────

async function send() {
  const text = $input.value.trim();
  if (!text || busy) return;
  busy = true;
  $sendBtn.disabled = true;
  $input.value = '';
  $input.style.height = 'auto';
  addMessage('user', text);
  setStatus('thinking…');
  try {
    await agentLoop(text);
    setStatus('ready', 'ok');
  } catch (e) {
    setStatus('error: ' + e.message, 'err');
  }
  busy = false;
  $sendBtn.disabled = false;
  $input.focus();
}

$sendBtn.addEventListener('click', send);

$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
});

$clearBtn.addEventListener('click', () => {
  history = [];
  $messages.innerHTML = '';
  setStatus('ready', 'ok');
});

// ── init ───────────────────────────────────────────────────────────────────

(async () => {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    provider = cfg.provider;
    if (cfg.hasKey) setStatus('ready — ' + provider, 'ok');
    else            setStatus('no API key set', 'err');
  } catch (e) {
    setStatus('server error', 'err');
  }
})();
</script>
</body>
</html>
